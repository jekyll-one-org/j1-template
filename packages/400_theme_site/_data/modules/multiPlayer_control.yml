# ------------------------------------------------------------------------------
# Description
#
description:
  title:                                J1 MultiPlayer
  scope:                                User control settings
  location:                             _data/modules/multiPlayer_control.yml

# ------------------------------------------------------------------------------
# User control settings
#
settings:

  players:

    # --------------------------------------------------------------------------
    # Player 1
    #
    - player:

      # GENERAL settings
      #
      enabled:                          true      
      id:                               player_1
      description:                      VideoJS Multi-Player 1

      # claude - Fix multiPlayer new select audio only #1
      # AUDIO ONLY playback (YouTube entries only, see multiPlayer.yml for
      # the full note). Seeds the initial state of the title-bar switch of
      # THIS player; a persisted user toggle wins.
      #
      audio_only:                       false

      # Per-media value edited in the player's Edit Media Settings dialog
      # (fields "Start At"/"End At") or shipped in a preloaded playlist JSON,
      # then the YAML chain: defaults <- user settings <- per-player entries
      #
      # startAt:                        ""

      # claude - Modify J1 VideoPlayerfor export #1
      # UI interface settings
      #
      # MEDIA EXPORT switches (see videoPlayer.yml for the full note). Only
      # the two export keys are declared here; the rate/edit/delete switches
      # of #52/#53 stay absent and keep their defaults.
      #
      ui_elements:
        playlist_download_button:       true
        playlist_download_all_button:   true

        # claude - Fix multiPlayer new select audio only #1
        audioOnlySwitch:                true

      # PLAYLIST settings
      #
      playlist:
        preload:                        []

        cards:
          perRow:                       2

      # VIDEOJS settings
      #
      videoJS:

        playbackRates:
          enabled:                      true
          values:                       [ 0.25, 0.5, 1, 1.5, 2 ]

        # PLUGIN settings
        #
        plugins:
          enabled:                      true

          hotKeys:
            enabled:                    true

          playlist:
            enabled:                    true

    # --------------------------------------------------------------------------
    # Player 2
    #
    - player:

      # GENERAL settings
      #
      enabled:                          true
      id:                               player_2
      description:                      VideoJS Multi-Player 2

      # claude - Fix multiPlayer new select audio only #1
      audio_only:                       false

      # claude - Fix multiPlayer for new startAt/endAt params #1
      # PLAYBACK WINDOW (all source kinds, see multiPlayer.yml for the full
      # note). Overloads the global startAt/endAt for THIS player; a
      # per-media value from the Edit Media Settings dialog wins.
      #
      startAt:                          ''
      endAt:                            ''

      # claude - Modify J1 VideoPlayerfor export #1
      ui_elements:
        playlist_download_button:       true
        playlist_download_all_button:   true

        # claude - Fix multiPlayer new select audio only #1
        audioOnlySwitch:                true

      # PLAYLIST settings
      #
      playlist:
        preload:                        []

        cards:
          perRow:                       2

      # VIDEOJS settings
      #
      videoJS:
        autoStart:                      true


    # --------------------------------------------------------------------------
    # Player 3 – Tiny Desk Concerts
    #
    - player:

      # GENERAL settings
      #
      enabled:                          true
      id:                               player_tiny_desk_concerts
      description:                      NPR Tiny Desk Concerts

      # PLAYLIST settings
      #
      playlist:
        preload:                        [ tinydesk-concerts.json ]
        preload_attempts:               4

        type:                           cards                                   # list | cards

        cards:
          perRow:                       3

      # claude - Fix multiPlayer new select audio only #1
      # AUDIO ONLY playback (YouTube entries only, see multiPlayer.yml for
      # the full note). Seeds the initial state of the title-bar switch of
      # THIS player; a persisted user toggle wins.
      #
      audio_only:                       false

      # claude - Fix multiPlayer for new startAt/endAt params #1
      # PLAYBACK WINDOW (all source kinds, see multiPlayer.yml for the full
      # note). Overloads the global startAt/endAt for THIS player; a
      # per-media value from the Edit Media Settings dialog wins.
      #
      startAt:                          ''
      endAt:                            ''

      # UI interface settings
      #
      ui_elements:
        edit_playlist_button:           false

        playlist_rate_button:           true
        playlist_edit_button:           true
        playlist_delete_button:         false

        # claude - Modify J1 VideoPlayerfor export #1
        playlist_download_button:       true
        playlist_download_all_button:   true

        # claude - Fix multiPlayer new select audio only #1
        audioOnlySwitch:                true

        mergeSwitch:                    false

      # VIDEOJS settings
      #
      videoJS:
        autoStart:                      true

        playbackRates:
          enabled:                      true
          values:                       [ 0.5, 1, 2 ]

        plugins:
          enabled:                      true

          playlist:
            enabled:                    true

    # --------------------------------------------------------------------------
    # Player 4 – Olivia Dean
    #
    - player:

      # GENERAL settings
      #
      enabled:                          true
      id:                               player_olivia_dean
      description:                      Olivia Dean - The Art Of Loving

      # PLAYLIST settings
      #
      playlist:
        preload:                        [ olivia-dean.json ]
        preload_attempts:               4

        type:                           cards                                   # list | cards

        cards:
          perRow:                       3

      # claude - Fix multiPlayer new select audio only #1
      # AUDIO ONLY playback (YouTube entries only, see multiPlayer.yml for
      # the full note). Seeds the initial state of the title-bar switch of
      # THIS player; a persisted user toggle wins.
      #
      audio_only:                       false

      # claude - Fix multiPlayer for new startAt/endAt params #1
      # PLAYBACK WINDOW (all source kinds, see multiPlayer.yml for the full
      # note). Overloads the global startAt/endAt for THIS player; a
      # per-media value from the Edit Media Settings dialog wins.
      #
      startAt:                          ''
      endAt:                            ''

      # UI interface settings
      #
      ui_elements:
        edit_playlist_button:           false

        playlist_rate_button:           true
        playlist_edit_button:           true
        playlist_delete_button:         false

        # claude - Modify J1 VideoPlayerfor export #1
        playlist_download_button:       true
        playlist_download_all_button:   true

        # claude - Fix multiPlayer new select audio only #1
        audioOnlySwitch:                true

        mergeSwitch:                    false

      # VIDEOJS settings
      #
      videoJS:
        autoStart:                      true

        playbackRates:
          enabled:                      true
          values:                       [ 0.5, 1, 2 ]

        plugins:
          enabled:                      true

          hotKeys:
            enabled:                    true

          playlist:
            enabled:                    true

# ------------------------------------------------------------------------------
# END config